name: experimental-production-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate config and health
        run: python scripts/healthcheck.py
      - name: Run tests
        run: pytest
      - name: Run deterministic synthetic smoke test
        run: python scripts/run_synthetic_demo.py --config configs/synthetic.yaml
      - name: Build frontend payload
        run: python scripts/build_frontend_data.py --config configs/default.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f docker/Dockerfile .
