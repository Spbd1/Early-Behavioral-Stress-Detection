services:
  research-demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["research-demo"]
    environment:
      BEHAVIORAL_STRESS_ENV: experimental
    volumes:
      - ../data:/app/data
    command: python scripts/run_synthetic_demo.py --config configs/production.experimental.yaml

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["dashboard"]
    environment:
      BEHAVIORAL_STRESS_ENV: experimental
    volumes:
      - ../data:/app/data
    ports:
      - "8080:8080"
    command: >
      sh -c "python scripts/run_synthetic_demo.py --config configs/production.experimental.yaml
      && python scripts/build_frontend_data.py --config configs/production.experimental.yaml
      && behavioral-stress-dashboard --host 0.0.0.0 --port 8080 --config configs/production.experimental.yaml"

  streamlit-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["streamlit"]
    volumes:
      - ../data:/app/data
    ports:
      - "8501:8501"
    command: streamlit run src/behavioral_stress/visualization/dashboard.py --server.address=0.0.0.0

  langflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["langflow"]
    ports:
      - "7860:7860"
    command: >
      sh -c "python -m pip install --no-cache-dir -e '.[langflow]'
      && langflow run --host 0.0.0.0"
