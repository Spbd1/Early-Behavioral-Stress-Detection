[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "M. Moradi" }
]
keywords = [
    "hidden-markov-models",
    "behavioral-economics",
    "computational-social-science",
    "economic-nowcasting",
    "digital-traces",
    "regime-detection",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "pydantic",
    "PyYAML",
    "joblib",
    "tqdm",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
langflow = [
    "langflow",
]
advanced = [
    "umap-learn",
    "ruptures",
    "xgboost",
]

[project.urls]
Homepage = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection"
Repository = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection"
Issues = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
