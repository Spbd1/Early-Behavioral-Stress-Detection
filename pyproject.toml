[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Prototype Contributors"}]
keywords = ["hidden-markov-model", "synthetic-data", "behavioral-ontology", "research-prototype"]
dependencies = []

[project.optional-dependencies]
langflow = []
dashboard = []
advanced = []
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
