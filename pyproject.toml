[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Prototype Contributors"}]
keywords = ["hidden-markov-model", "synthetic-data", "behavioral-ontology", "research-prototype"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "plotly>=5.17",
  "PyYAML>=6.0",
  "typer>=0.9",
  "joblib>=1.3",
]

[project.optional-dependencies]
langflow = ["langflow>=1.0"]
dashboard = ["streamlit>=1.28", "plotly>=5.17"]
advanced = ["hmmlearn>=0.3", "ruptures>=1.1", "xgboost>=2.0", "umap-learn>=0.5"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
