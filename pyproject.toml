[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Prototype Contributors"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "plotly>=5.17",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "typer>=0.9",
  "pytest>=7.4",
  "joblib>=1.3",
  "tqdm>=4.66",
  "duckdb>=0.9",
  "streamlit>=1.28",
]

[project.optional-dependencies]
advanced = ["hmmlearn>=0.3", "ruptures>=1.1", "xgboost>=2.0", "umap-learn>=0.5"]
langflow = ["langflow>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
