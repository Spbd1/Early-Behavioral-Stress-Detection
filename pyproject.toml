[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "pydantic",
    "PyYAML",
    "joblib",
    "tqdm",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
langflow = ["langflow"]
advanced = ["umap-learn", "ruptures", "xgboost"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
