[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research Prototype Contributors"}]
keywords = ["hidden-markov-model", "synthetic-data", "behavioral-ontology", "research-prototype"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
langflow = []
dashboard = []
advanced = []
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
