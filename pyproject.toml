[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-stress-regime-detection"
version = "0.1.0"
description = "Research prototype for latent behavioral stress regime detection in aggregate economic traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "M. Moradi" }
]
keywords = [
    "hidden-markov-models",
    "behavioral-economics",
    "computational-social-science",
    "economic-nowcasting",
    "digital-traces",
    "regime-detection",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "joblib>=1.3,<2",
    "tqdm>=4.66,<5",
    "plotly>=5,<7",
    "streamlit>=1.32,<2",
]

[project.scripts]
behavioral-stress-ingest = "behavioral_stress.ingestion.cli:main"
behavioral-stress-dashboard = "behavioral_stress.api.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
dashboard = [
    "streamlit>=1.32,<2",
    "plotly>=5,<7",
]
ingestion = [
    "pytrends>=4.9,<5",
]
langflow = [
    "langflow>=1,<2",
]
advanced = [
    "umap-learn>=0.5,<1",
    "ruptures>=1.1,<2",
    "xgboost>=2,<4",
]

[project.urls]
Homepage = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection"
Repository = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection"
Issues = "https://github.com/Spbd1/Early-Behavioral-Stress-Detection/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
